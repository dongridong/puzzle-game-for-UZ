<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>마지막 영상</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .final-video-page {
      position: relative;
      overflow: hidden;
      align-items: center;
      background:
        radial-gradient(circle at 14% 20%, rgba(255, 192, 212, 0.24), transparent 34%),
        radial-gradient(circle at 84% 12%, rgba(255, 231, 179, 0.2), transparent 36%),
        linear-gradient(145deg, #311f33 0%, #161b33 52%, #102238 100%);
      padding: clamp(16px, 4vw, 32px);
    }

    .final-video-shell {
      position: relative;
      z-index: 1;
      width: min(920px, 100%);
      padding: clamp(18px, 3vw, 28px);
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: linear-gradient(160deg, rgba(40, 25, 50, 0.88), rgba(15, 24, 42, 0.88));
      box-shadow:
        0 24px 60px rgba(0, 0, 0, 0.42),
        inset 0 0 0 1px rgba(255, 255, 255, 0.05);
      text-align: center;
    }

    .final-video-shell h1 {
      margin: 0 0 10px;
      color: #fff7f2;
      font-size: clamp(1.5rem, 4vw, 2.2rem);
      font-family: "Nanum Myeongjo", "Noto Serif KR", "Times New Roman", serif;
    }

    .final-video-shell p {
      margin: 0 0 18px;
      color: rgba(255, 247, 242, 0.84);
      line-height: 1.6;
      font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }

    .final-video-player {
      display: block;
      width: 100%;
      border-radius: 18px;
      background: #000;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.34);
    }

    .final-video-actions {
      margin-top: 16px;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .final-video-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 160px;
      height: 46px;
      padding: 0 18px;
      border-radius: 999px;
      border: 0;
      cursor: pointer;
      text-decoration: none;
      font: inherit;
      font-weight: 700;
    }

    .final-video-link--primary {
      color: #2b1528;
      background: linear-gradient(120deg, #ffd2de 0%, #ffe7be 100%);
    }

    .final-video-link--secondary {
      color: #fff3ed;
      background: rgba(255, 255, 255, 0.12);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.18);
    }

    @media (max-width: 640px) {
      .final-video-shell {
        padding: 16px;
        border-radius: 18px;
      }
    }
  </style>
</head>
<body class="final-video-page">
  <main class="final-video-shell">
    <h1>영상 편지 >3<</h1>
    <p>집중해서 보도록 하라!</p>
    <video id="finalVideo" class="final-video-player" controls autoplay playsinline preload="auto">
      <source src="assets/uz_fin.mp4" type="video/mp4" />
      브라우저가 비디오 재생을 지원하지 않습니다.
    </video>
    <div class="final-video-actions">
      <button id="playButton" class="final-video-link final-video-link--primary" type="button" hidden>영상 재생</button>
      <a class="final-video-link final-video-link--secondary" href="ending.html">건너뛰고 바로 이동</a>
    </div>
  </main>
  <script>
    const video = document.getElementById("finalVideo");
    const playButton = document.getElementById("playButton");

    function goToEnding() {
      window.location.replace("ending.html");
    }

    video.addEventListener("ended", goToEnding);
    video.addEventListener("error", () => {
      playButton.hidden = true;
    });

    video.play().catch(() => {
      playButton.hidden = false;
    });

    playButton.addEventListener("click", async () => {
      try {
        await video.play();
        playButton.hidden = true;
      } catch (error) {
        playButton.hidden = false;
      }
    });
  </script>
</body>
</html>
